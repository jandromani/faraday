name: faraday-v095-pilot
services:
  backend:
    image: node:22.16-alpine
    working_dir: /app
    user: "${FARADAY_HOST_UID:?}:${FARADAY_HOST_GID:?}"
    command: ["node", "bin/faraday-pilot-backend.js"]
    environment:
      FARADAY_BACKEND_SECRET_FILE: /run/faraday/backend-secret
      FARADAY_BACKEND_DB: /run/backend-state/actions.sqlite
      FARADAY_BACKEND_ATTESTATION_PRIVATE_FILE: /run/backend-state/backend-attestation-private.pem
    volumes:
      - ${FARADAY_APP_DIR:?}:/app:ro
      - ${FARADAY_LAB_DIR:?}/gateway/backend-secret:/run/faraday/backend-secret:ro
      - ${FARADAY_LAB_DIR:?}/backend:/run/backend-state
    networks: [backend_private]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  gateway:
    image: node:22.16-alpine
    working_dir: /app
    user: "${FARADAY_HOST_UID:?}:${FARADAY_HOST_GID:?}"
    command: ["node", "bin/faraday-pilot-gateway.js"]
    environment:
      FARADAY_PILOT_CONFIG: /run/faraday/pilot.json
    volumes:
      - ${FARADAY_APP_DIR:?}:/app:ro
      - ${FARADAY_LAB_DIR:?}/gateway:/run/faraday:ro
      - ${FARADAY_LAB_DIR:?}/gateway-state:/run/state
    networks: [agent_zone, backend_private]
    depends_on: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  dummy-agent:
    image: node:22.16-alpine
    working_dir: /app
    user: "${FARADAY_HOST_UID:?}:${FARADAY_HOST_GID:?}"
    command: ["node", "scripts/docker-pilot-client.mjs"]
    volumes:
      - ${FARADAY_APP_DIR:?}:/app:ro
      - ${FARADAY_LAB_DIR:?}/agent:/run/agent:ro
    networks: [agent_zone]
    depends_on: [gateway]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  rogue-tool:
    profiles: [adversary]
    image: node:22.16-alpine
    working_dir: /app
    user: "${FARADAY_HOST_UID:?}:${FARADAY_HOST_GID:?}"
    command: ["node", "scripts/enclave-rogue.mjs"]
    volumes:
      - ${FARADAY_APP_DIR:?}:/app:ro
    networks: [agent_zone]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  outside:
    profiles: [adversary]
    image: node:22.16-alpine
    command: ["node", "-e", "require('node:http').createServer((req,res)=>res.end('fixture')).listen(8097,'0.0.0.0')"]
    networks: [outside_zone]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
  egress-control:
    profiles: [adversary]
    image: node:22.16-alpine
    command: ["node", "-e", "(async()=>{for(let n=0;n<40;n++){try{if((await fetch('http://outside:8097/',{signal:AbortSignal.timeout(300)})).ok)return}catch{}await new Promise(r=>setTimeout(r,150))}process.exitCode=1})()"]
    networks: [outside_zone]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
networks:
  agent_zone:
    driver: bridge
    internal: true
  backend_private:
    driver: bridge
    internal: true
  outside_zone:
    driver: bridge
