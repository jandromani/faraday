name: FARADAY Security Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install cryptography
        run: python -m pip install -r requirements.txt
      - name: Execute Build 001 and Build 002 security tests
        run: python -m unittest discover -s tests -v
      - name: Verify Build 001 demo
        run: python faraday.py demo
      - name: Verify Build 002 separate-process integration
        run: python scripts/demo_v2.py
