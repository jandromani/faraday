name: FARADAY R14 Signed Delegation Attenuation
on:
  pull_request:
    paths:
      - 'agentic/lib/delegation-chain.js'
      - 'agentic/tests/delegation-chain.test.js'
      - '.github/workflows/r14-delegation.yml'
  push:
    branches: [master]
    paths:
      - 'agentic/lib/delegation-chain.js'
      - 'agentic/tests/delegation-chain.test.js'
      - '.github/workflows/r14-delegation.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delegation-negative:
    name: Delegation signatures, non-amplification and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real Ed25519 multi-hop and negative security checks
        working-directory: agentic
        run: node --test tests/delegation-chain.test.js
