name: FARADAY R5 Postgres Fencing Integration
on:
  pull_request:
    paths:
      - 'agentic/lib/postgres-fencing-protocol.js'
      - 'agentic/scripts/postgres-fencing-smoke.mjs'
      - '.github/workflows/r5-postgres-fencing.yml'
  push:
    branches: [master]
    paths:
      - 'agentic/lib/postgres-fencing-protocol.js'
      - 'agentic/scripts/postgres-fencing-smoke.mjs'
      - '.github/workflows/r5-postgres-fencing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postgres-fencing:
    name: Two-process PostgreSQL fencing and idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start isolated official PostgreSQL (no published ports)
        run: |
          docker run -d --rm --name faraday-r5-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_USER=faraday -e POSTGRES_DB=faraday \
            postgres:17
          for i in $(seq 1 40); do
            if docker exec faraday-r5-postgres pg_isready -U faraday -d faraday -q; then exit 0; fi
            sleep 1
          done
          echo 'Postgres not ready'; exit 1
      - name: Fencing epochs, stale owners, crash-restart replay and 8 concurrent workers
        working-directory: agentic
        run: node scripts/postgres-fencing-smoke.mjs
      - name: Dispose of PostgreSQL
        if: always()
        run: docker rm -f faraday-r5-postgres || true
