name: FARADAY Signed Journal Recovery
on:
  push:
    paths:
      - 'agentic/**'
      - '.github/workflows/journal-recovery.yml'
  pull_request:
    paths:
      - 'agentic/**'
      - '.github/workflows/journal-recovery.yml'
jobs:
  signed-backup:
    name: Backup integrity and restore / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: 22}
          - {os: ubuntu-latest, node: 24}
          - {os: macos-latest, node: 24}
          - {os: windows-latest, node: 24}
    defaults:
      run:
        working-directory: agentic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run recovery:test
      - run: npm pack --dry-run
