name: Materialize FARADAY Agentic Graph
on:
  push:
    paths:
      - '.bootstrap/agentic_bundle.b64'
      - '.github/workflows/materialize-agentic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned source archive
        run: |
          base64 --decode .bootstrap/agentic_bundle.b64 > /tmp/faraday-agentic.tar.gz
          echo 'cf9e35d37fad38f65b66177d0aa640019bd0253194c853d563d293f28a74577e  /tmp/faraday-agentic.tar.gz' | sha256sum -c -
          tar -tzf /tmp/faraday-agentic.tar.gz | grep -E '^(README.md|package.json|bin/|lib/|web/|tests/)' >/dev/null
      - name: Materialize reproducible agentic source
        run: |
          mkdir -p agentic
          tar -xzf /tmp/faraday-agentic.tar.gz -C agentic --no-same-owner --no-same-permissions
          chmod +x agentic/bin/faraday.js
      - name: Verify tests and demo
        run: |
          cd agentic
          npm test
          node bin/faraday.js demo --db /tmp/faraday-ci-graph.sqlite
          node bin/faraday.js graph --db /tmp/faraday-ci-graph.sqlite --format mermaid | grep 'flowchart LR'
      - name: Commit source into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentic
          if ! git diff --staged --quiet; then
            git commit -m "feat(agentic): ship FARADAY Graph discovery and passive MCP runtime"
            git push
          fi
