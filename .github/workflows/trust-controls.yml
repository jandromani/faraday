name: FARADAY Trust Hardening and Recovery
on:
  push:
    paths:
      - 'agentic/**'
      - '.github/workflows/trust-controls.yml'
  pull_request:
    paths:
      - 'agentic/**'
      - '.github/workflows/trust-controls.yml'
jobs:
  trust:
    name: Trust controls / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: 22}
          - {os: ubuntu-latest, node: 24}
          - {os: macos-latest, node: 24}
          - {os: windows-latest, node: 24}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agentic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Revocation, backend credential rotation and witness evidence
        run: npm run trust:test
      - name: Existing OAuth HTTP regression
        run: npm run oauth:test
      - name: Package integrity
        run: npm pack --dry-run
