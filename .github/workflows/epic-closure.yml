name: FARADAY 15-Epic Scoped Acceptance
on:
  push:
    paths:
      - 'agentic/**'
      - '.github/workflows/epic-closure.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: 'Acceptance / ${{ matrix.os }} / Node ${{ matrix.node }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify 15 scoped acceptances and write versioned evidence report
        working-directory: agentic
        shell: bash
        run: |
          node scripts/epic-closure-report.mjs --out epic-closure-report.json
      - name: Upload per-platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-closures-${{ matrix.os }}-node-${{ matrix.node }}
          path: agentic/epic-closure-report.json
          if-no-files-found: ignore
          retention-days: 30
  release-regression:
    name: 'Full Linux regression + release audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node/Python complete regression and local package safety audit
        working-directory: agentic
        run: npm run test:all
