name: FARADAY Architecture and Blocking Assurance
on:
  push:
    paths:
      - 'agentic/**'
      - '.github/workflows/architecture-assurance.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify component boundaries, privacy and assurance logic
        working-directory: agentic
        run: npm run architecture:test
      - name: Blocking assurance (including adversarial Docker)
        working-directory: agentic
        run: npm run assurance:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faraday-assurance-evidence
          path: agentic/artifacts/faraday-assurance.json
          if-no-files-found: warn
