name: FARADAY R1 Release Assurance and Attested Candidate
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'After all gates pass, publish a Developer Preview prerelease to GitHub (never npm)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: faraday-r1-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression-and-boundary:
    name: R1 full regression and adversarial deployment
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full test suite, package audit and synthetic evaluations
        working-directory: agentic
        run: npm run test:all
      - name: Blocking adversarial deployment assurance (Docker)
        working-directory: agentic
        run: npm run assurance:ci
      - name: Exercise reversible cold onboarding on Linux
        working-directory: agentic
        run: npm run onboard:smoke
      - name: Scoped acceptance (no Enterprise claim)
        working-directory: agentic
        run: npm run closure:test
  official-client:
    name: R1 official MCP client / ${{ matrix.os }}
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned official MCP client and filesystem server
        shell: bash
        run: |
          npm install --prefix "${{ runner.temp }}/faraday-r1-mcp" --ignore-scripts --no-audit --no-fund \
            @modelcontextprotocol/sdk@1.32.2 @modelcontextprotocol/server-filesystem@2.0.1
      - name: Real read-only stdio client -> FARADAY proxy -> filesystem
        working-directory: agentic
        env:
          FARADAY_MCP_FIXTURES: ${{ runner.temp }}/faraday-r1-mcp
        run: node scripts/real-mcp-client-smoke.mjs
      - name: Verify offline package onboarding without weakening Windows ACL policy
        working-directory: agentic
        run: npm run onboard:smoke
  vault-least-privilege:
    name: R1 real Vault AppRole least-privilege and revocation
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start disposable official Vault dev instance
        run: >-
          docker run -d --rm --name faraday-r1-vault
          -p 127.0.0.1:18200:8200
          -e VAULT_DEV_ROOT_TOKEN_ID=faraday-ci-dev-root-token-not-production
          -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
          hashicorp/vault:1.20.4 server -dev
      - name: Prove restricted AppRole, forbidden paths and token revocation
        working-directory: agentic
        env:
          FARADAY_TEST_VAULT_TOKEN: faraday-ci-dev-root-token-not-production
          FARADAY_TEST_VAULT_URL: http://127.0.0.1:18200
        run: node scripts/vault-dev-smoke.mjs
      - name: Dispose of Vault
        if: always()
        run: docker rm -f faraday-r1-vault || true
  live-keycloak:
    name: R11 release Keycloak Vault Authority and MCP
    uses: ./.github/workflows/r5-keycloak-oidc.yml
    permissions:
      contents: read
  live-postgres:
    name: R11 release PostgreSQL epoch fencing and outage
    uses: ./.github/workflows/r7-fenced-mcp.yml
    permissions:
      contents: read
  release-native-pg:
    name: R12 SQL privilege separation
    uses: ./.github/workflows/r12-native-pg.yml
    permissions:
      contents: read
  release-lease-expiry:
    name: R13 lease expiry fencing
    uses: ./.github/workflows/r13-expiring-lease.yml
    permissions:
      contents: read
  release-delegation:
    name: R14 cryptographic delegation
    uses: ./.github/workflows/r14-delegation.yml
    permissions:
      contents: read
  release-adversarial:
    name: R15 fail-closed adversarial matrix
    uses: ./.github/workflows/r15-adversarial.yml
    permissions:
      contents: read
  release-network-partition:
    name: R18 actual separated-container network partition
    uses: ./.github/workflows/r18-network-partition.yml
    permissions:
      contents: read
  attest-candidate:
    name: R1 candidate, exact archive/SBOM verification and Sigstore provenance
    if: github.ref == 'refs/heads/master'
    needs: [regression-and-boundary, official-client, vault-least-privilege, live-keycloak, live-postgres, release-native-pg, release-lease-expiry, release-delegation, release-adversarial, release-network-partition]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build package and SPDX source-file inventory; compare every archived file
        working-directory: agentic
        env:
          FARADAY_RELEASE_DIR: ${{ runner.temp }}/faraday-r1-release
        run: node scripts/release-candidate.mjs build "$FARADAY_RELEASE_DIR" "$GITHUB_SHA"
      - name: Verify exact package and commit before signing
        working-directory: agentic
        env:
          FARADAY_RELEASE_DIR: ${{ runner.temp }}/faraday-r1-release
        run: node scripts/release-candidate.mjs verify "$FARADAY_RELEASE_DIR" "$GITHUB_SHA"
      - name: Attest package provenance with GitHub OIDC / Sigstore
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/faraday-r1-release/faraday-agentic-0.99.9.tgz
      - name: Verify hosted attestation through GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          FARADAY_RELEASE_DIR: ${{ runner.temp }}/faraday-r1-release
        run: gh attestation verify "$FARADAY_RELEASE_DIR/faraday-agentic-0.99.9.tgz" --repo "$GITHUB_REPOSITORY"
      - name: Upload exact signed-candidate input files
        uses: actions/upload-artifact@v4
        with:
          name: faraday-r1-attested-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/faraday-r1-release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish first attested Developer Preview once, after every R1 gate
        if: inputs.publish_prerelease == true || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          FARADAY_RELEASE_DIR: ${{ runner.temp }}/faraday-r1-release
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="v0.99.9-r11-preview"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "The one-time R11 Developer Preview already exists; no additional release"
              exit 0
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Release tag already exists without the expected release; refusing to retarget"
              exit 1
            fi
          else
            tag="v0.99.9-rc.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" "$FARADAY_RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'FARADAY v0.99.9 Developer Preview (verified R1)' \
            --notes 'DEVELOPER PREVIEW ONLY. R1: official MCP clients on 3 OS, Vault AppRole, Docker no-bypass, package integrity and hosted GitHub Sigstore attestation. No production security certification, HA guarantee or npm publication.'
