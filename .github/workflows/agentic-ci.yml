name: FARADAY Agentic Graph CI
on:
  push:
    paths:
      - 'agentic/**'
      - '.github/workflows/agentic-ci.yml'
  pull_request:
    paths:
      - 'agentic/**'
      - '.github/workflows/agentic-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run security, contracts, plug-and-use tests and package smoke
        working-directory: agentic
        run: npm run test:all
      - name: Validate CLI contracts snapshot and diff
        working-directory: agentic
        run: |
          node bin/faraday.js contracts snapshot --db .faraday/graph.sqlite --out /tmp/faraday-current.json
          node bin/faraday.js contracts compare --base /tmp/faraday-current.json --current /tmp/faraday-current.json --fail-on-breaking
