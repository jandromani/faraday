name: FARADAY Agentic Graph CI
on:
  push:
    paths:
      - 'agentic/**'
      - '.github/workflows/agentic-ci.yml'
  pull_request:
    paths:
      - 'agentic/**'
      - '.github/workflows/agentic-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test Graph, v0.95 secure pilot, v0.9 authority, contracts, synthetic lab and package
        working-directory: agentic
        run: npm run test:all
      - name: Verify v0.95 protected MCP pilot eval is reproducible
        working-directory: agentic
        run: |
          node bin/faraday.js pilot eval --limit 100 --out /tmp/faraday-v095-pilot-evals.json
          node -e "const r=require('/tmp/faraday-v095-pilot-evals.json');if(r.summary.total!==100||r.summary.passed!==100||r.summary.failed!==0)process.exit(1)"
      - name: Verify safe offline replay and read-only recovery inspector
        working-directory: agentic
        run: |
          npm run timemachine:smoke
          npm run benchmark:smoke
      - name: Measure deterministic security mutation coverage
        working-directory: agentic
        run: node --experimental-test-coverage --test-coverage-include=lib/authority.js --test-coverage-include=lib/approvals.js --test tests/fuzz.test.js
      - name: Generate offline SPDX bill of materials
        working-directory: agentic
        run: |
          node scripts/release-audit.mjs /tmp/faraday-${{ matrix.node-version }}-spdx.json
      - name: Export static compatibility and synthetic lab artifacts
        working-directory: agentic
        run: |
          node bin/faraday.js authority eval --limit 100 --out /tmp/faraday-v09-authority-evals.json > /tmp/faraday-v09-authority-summary.json
          node -e "const r=require('/tmp/faraday-v09-authority-evals.json');if(r.summary.total!==100||r.summary.passed!==100||r.summary.failed!==0)process.exit(1)"
          node bin/faraday.js compat --root . > /tmp/faraday-v09-compat.json
          node bin/faraday.js lab fixture --out /tmp/faraday-v09-fixture
          node bin/faraday.js lab run --seed 42 --out /tmp/faraday-v09-evals.json > /tmp/faraday-v09-summary.json
          node -e "const r=require('/tmp/faraday-v09-evals.json');if(r.summary.total!==1000||r.summary.failed!==0||r.summary.gaps!==350)process.exit(1)"
          node bin/faraday.js contracts snapshot --db .faraday/graph.sqlite --out /tmp/faraday-current.json
          node bin/faraday.js contracts compare --base /tmp/faraday-current.json --current /tmp/faraday-current.json --fail-on-breaking
      - name: Publish synthetic evaluation report as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: faraday-v09-evals-node-${{ matrix.node-version }}
          path: |
            /tmp/faraday-v09-evals.json
            /tmp/faraday-v09-authority-evals.json
            /tmp/faraday-v09-compat.json
            /tmp/faraday-v095-pilot-evals.json
            /tmp/faraday-${{ matrix.node-version }}-spdx.json
          retention-days: 14

  network-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Docker and Compose versions
        run: |
          docker --version
          docker compose version
      - name: Demonstrate isolated dummy-agent network and authority flow
        working-directory: agentic
        run: npm run lab:docker
      - name: Verify v0.95 MCP pilot in Docker, including receipt signing and replay
        working-directory: agentic
        run: npm run pilot:docker
